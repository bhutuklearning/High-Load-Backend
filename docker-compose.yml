services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - express-api-1
      - express-api-2
      - express-api-3
    restart: unless-stopped

  express-api-1:
    build:
      context: ./express-api
    container_name: express-api-1
    # env_file:
    #   - ./express-api/.env
    environment:
      PORT: 4000

      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: highload

      REDIS_HOST: redis
      REDIS_PORT: 6379

      DATABASE_URL: postgresql://admin:admin@pgbouncer:5432/highload

      DIRECT_DATABASE_URL: postgresql://admin:admin@postgres:5432/highload
      DISABLE_RATE_LIMITER: "true"
    depends_on:
      - postgres
      - redis
      - pgbouncer
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:4000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  express-api-2:
    build:
      context: ./express-api
    container_name: express-api-2
    # env_file:
    #   - ./express-api/.env
    environment:
      PORT: 4000

      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: highload

      REDIS_HOST: redis
      REDIS_PORT: 6379

      DATABASE_URL: postgresql://admin:admin@pgbouncer:5432/highload

      DIRECT_DATABASE_URL: postgresql://admin:admin@postgres:5432/highload
      DISABLE_RATE_LIMITER: "true"
    depends_on:
      - postgres
      - redis
      - pgbouncer
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:4000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  express-api-3:
    build:
      context: ./express-api
    container_name: express-api-3
    # env_file:
    #   - ./express-api/.env
    environment:
      PORT: 4000

      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: highload

      REDIS_HOST: redis
      REDIS_PORT: 6379

      DATABASE_URL: postgresql://admin:admin@pgbouncer:5432/highload

      DIRECT_DATABASE_URL: postgresql://admin:admin@postgres:5432/highload
      DISABLE_RATE_LIMITER: "true"
    depends_on:
      - postgres
      - redis
      - pgbouncer
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:4000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine

    container_name: postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: highload

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest

    container_name: pgbouncer

    environment:
      DB_USER: admin
      DB_PASSWORD: admin
      DB_HOST: postgres
      DB_NAME: highload
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
